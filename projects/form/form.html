<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <header>
        Chung's Web Design
    </header>
    <main>
        <form action="formprocessing.html" method="post">
            <fieldset>
                <legend>Account</legend>
                <div class="form-row">
                    <label for="personname">Full Name</label>
                    <input id="personname" type="text" name="fullname" placeholder="Full Name">
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" value="slade@ydh.edu">
                </div>
                <div class="form-row">
                    <label for="bdate">Birthdate</label>
                    <input type="date" name="bdate" id="bdate">
                </div>
                <div class="form-row">
                    <label for="password">Password</label>
                    <input type="password" name="pass" id="password">
                </div>
                <div class="form-row">
                    <label for="state">State</label>
                    <select name="state" id="state">
                        <option value="blank"></option>
                        <option value="CA">California</option>
                        <option value="HI">Hawaii</option>
                        <option value="UT">Utah</option>
                    </select>
                </div>
                <div class="check-row">
                    <div class="spacer"></div>
                    <label><input type="checkbox" name="remember"> Remember Me</label>
                </div>
                <div class="check-row">
                    <div class="spacer">Gender</div>
                    <label><input type="radio" name="gender" value="male"> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                </div>
                <div class="form-row">
                    <label for="comments">Comments</label>
                    <textarea name="comments" id="comments"></textarea>
                </div>
                <div class="form-row">
                    <div class="spacer"></div>
                    <input type="submit" value="Sign Up">
                </div>
            </fieldset>
        </form>
    </main>
    <footer>
        <p>&copy; Kin Chung Ng 2026</p>
    </footer>
</body>
</html>
