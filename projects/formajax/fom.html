<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="form.css">
    </head>
<body>
    <header>
        <h1>Chung's Web Design</h1>
    </header>
    <main>
        <div id="message"></div>
        <form action="processing.html" method="post" id="myForm">
            <div>First Name: <input type="text" id="firstName" name="firstName" placeholder="First Name"></div>
            <div>Last Name: <input type="text" id="lastName" name="lastName" placeholder="Last Name"></div>
            <div>Password: <input type="password" id="password" name="password"></div>
            <div><input type="checkbox" name="remember" checked id="remember"> Remember Me</div>
            <div>Age: <input type="number" name="age" id="age"></div>
            <div>Birthdate: <input type="date" name="birthdate" id="birthdate"></div>

            <div>Class:
                <input type="radio" name="class" value="freshman">Freshman
                <input type="radio" name="class" value="sophomore">Sophomore
                <input type="radio" name="class" value="junior">Junior
                <input type="radio" name="class" value="senior">Senior
            </div>

            <div>State: <select name="state" id="state">
                <option value="none" disabled selected>Make Selection</option>
                <option value="hi">Hawaii</option>
                <option value="ca">California</option>
                <option value="co">Colorado</option>
                <option value="ut">Utah</option>
                <option value="ny">New York</option>
            </select></div>

            <div><input type="submit"></div>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Kin Chung Ng</p>
    </footer>
        <script src="form.js"></script>
</body>
</html>
